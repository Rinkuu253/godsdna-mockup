<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>God's DNA · Mockup</title><link rel="stylesheet" href="../assets/fonts.css">

<style>
body{margin:0}
a{color:#24508A}a:hover{color:#163A68}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #E6A93A;outline-offset:2px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
main>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}main>*:nth-child(2){animation-delay:.07s}main>*:nth-child(3){animation-delay:.14s}main>*:nth-child(4){animation-delay:.21s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.r>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}.r>*:nth-child(2){animation-delay:.12s}.r>*:nth-child(3){animation-delay:.24s}.r>*:nth-child(4){animation-delay:.36s}
.acc{transition:background .3s,border-color .3s}
.panel{transition:grid-template-rows .35s cubic-bezier(.4,0,.2,1),visibility .35s}
.desc{transition:opacity .3s ease .05s,transform .35s cubic-bezier(.2,.8,.2,1)}
.ic,.ic .v{transition:transform .35s cubic-bezier(.4,0,.2,1);transform-origin:center}
@media (prefers-reduced-motion: reduce){.acc,.panel,.desc,.ic,.ic .v{transition:none}}
</style>
<style>body{margin:0;background:#0B1630;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}#stage{width:390px;height:844px;overflow:auto;position:relative;background:#EDF2F8}</style></head><body><div id="stage" data-w="390" data-h="844"></div><template id="tpl">

<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: linear-gradient(175deg,#0B1630 0%,#163A68 50%,#24508A 100%); color: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
<header style="padding: 36px 28px 0; display: flex; justify-content: space-between; align-items: center"><img src="../assets/logo.png" alt="God's DNA" style="width: 118px; height: 16px"><div role="img" aria-label="Langkah 3 dari 3" style="display: flex; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.35)"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.35)"></span><span style="width: 28px; height: 8px; border-radius: 999px; background: #E6A93A"></span></div></header>
<main class="r" style="flex: 1; min-height: 0; padding: 0 28px 32px; display: flex; flex-direction: column; gap: 18px"><div style="margin-top: 36px"><h1 style="font-family: 'Archivo', sans-serif; font-stretch: 68%; font-weight: 850; text-transform: uppercase; line-height: 1; margin: 0; font-size: 44px; line-height: 0.98">4 modul<br>bareng mentormu</h1></div>
<div style="display: flex; flex-direction: column; gap: 10px"><sc-for list="{{ mods }}" as="m" hint-placeholder-count="4"><div class="acc" style="border: 1px solid {{ m.border }}; border-radius: 16px; background: {{ m.bg }}"><button type="button" onClick="{{ m.toggle }}" aria-expanded="{{ m.open }}" style="width: 100%; min-height: 60px; display: flex; align-items: center; gap: 14px; padding: 8px 16px; border: 0; background: none; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; text-align: left; cursor: pointer"><span style="color: #F5CB72">{{ m.no }}</span><span style="flex: 1">{{ m.title }}</span><svg aria-hidden="true" class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="transform: rotate({{ m.turn }})"><path d="M5 12h14"></path><path class="v" d="M12 5v14" style="transform: scaleY({{ m.vert }})"></path></svg></button><div class="panel" style="display: grid; grid-template-rows: {{ m.rows }}; visibility: {{ m.vis }}"><div style="overflow: hidden; min-height: 0"><p class="desc" style="margin: 0; padding: 0 16px 16px 46px; font-size: 13px; line-height: 20px; color: #D6E4F6; opacity: {{ m.op }}; transform: translateY({{ m.y }})">{{ m.desc }}</p></div></div></div></sc-for></div><a href="Daftar.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; flex-shrink: 0; border: 0; border-radius: 14px; background: linear-gradient(180deg,#2F62A4,#24508A); box-shadow: 0 4px 0 #163A68; color: #FFFFFF; font-family: 'Archivo', sans-serif; font-stretch: 80%; font-weight: 800; font-size: 18px; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; cursor: pointer; background: #E6A93A; box-shadow: 0 4px 0 #A46F10; color: #16233A; margin-top: auto">Aku mau mulai</a></main>
</div>
</template><script>class DCLogic{constructor(){this.props={}}setState(s){Object.assign(this.state,typeof s=="function"?s(this.state):s);window.__paint&&__paint()}forceUpdate(){window.__paint&&__paint()}}

class Component extends DCLogic {
  state = { open: 0 };
  renderVals() {
    const M = [['Mengenal Allah', 'Siapa Allah dan bagaimana Ia menyatakan diri-Nya.'], ['Identitas di dalam Kristus', 'Siapa dirimu setelah menjadi ciptaan baru.'], ['Hidup dalam komunitas', 'Bertumbuh bersama dan saling menguatkan.'], ['Misi dan dampak', 'Membawa kebaikan Tuhan ke sekitarmu.']];
    const cur = this.state.open;
    return { mods: M.map(([title, desc], i) => ({ no: '0' + (i + 1), title, desc, open: cur === i, turn: cur === i ? '180deg' : '0deg', vert: cur === i ? 0 : 1, rows: cur === i ? '1fr' : '0fr', vis: cur === i ? 'visible' : 'hidden', op: cur === i ? 1 : 0, y: cur === i ? '0px' : '-8px', bg: cur === i ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.08)', border: cur === i ? 'rgba(245,203,114,0.6)' : 'rgba(255,255,255,0.22)', toggle: () => this.setState({ open: cur === i ? -1 : i }) })) };
  }
}
</script><script src="../assets/runtime.js"></script></body></html>
