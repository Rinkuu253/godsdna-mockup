x; font-style: italic">"Jadi siapa yang ada di dalam Kristus, ia adalah ciptaan baru: yang lama sudah berlalu, sesungguhnya yang baru sudah datang."</p><footer style="margin-top: 10px; font-size: 13px; font-weight: 700; color: #F5CB72">2 Korintus 5:17 (TB)</footer></blockquote><p style="margin: 0; font-size: 16px; line-height: 26px">Ciptaan baru bukan versi lama yang dipoles. Di dalam Kristus, Tuhan memberi awal yang baru.</p><p style="margin: 0; font-size: 16px; line-height: 26px">Perubahan ini dimulai dari apa yang Tuhan kerjakan, bukan dari usaha kita memperbaiki diri.</p><div style="border-radius: 16px; background: #DFE8F3; border-left: 4px solid #24508A; padding: 14px 16px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #24508A">INTINYA</div><div style="margin-top: 4px; font-size: 15px; line-height: 22px; font-weight: 700">Identitas barumu adalah pemberian.</div></div></div></sc-if><sc-if value="{{ s1 }}" hint-placeholder-val="{{ false }}"><div class="step" style="display: flex; flex-direction: column; gap: 14px"><h1 style="font-family: 'Archivo', sans-serif; font-stretch: 68%; font-weight: 850; text-transform: uppercase; line-height: 1; margin: 0; font-size: 36px; padding-top: 6px">Di dalam Kristus</h1><p style="margin: 0; font-size: 16px; line-height: 26px">Kalimat kuncinya ada di awal ayat: "ada di dalam Kristus". Ini bicara soal hubungan, bukan sekadar status anggota gereja.</p><p style="margin: 0; font-size: 16px; line-height: 26px">Percaya berarti hidupmu sekarang terhubung dengan Dia.</p><div style="background: #FAFCFE; border: 1px solid #D0DCEA; border-radius: 20px; box-sizing: border-box; padding: 12px 16px; display: flex; align-items: center; gap: 12px; color: #24508A"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M4 5a2 2 0 012-2h14v16H6a2 2 0 00-2 2zM4 21V5"></path></svg
