<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>God's DNA · Mockup</title><link rel="stylesheet" href="../assets/fonts.css">

<style>
body{margin:0}
a{color:#24508A}a:hover{color:#0B1630}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #E6A93A;outline-offset:2px}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.15)}100%{transform:translate(0,0) scale(1)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes dock{from{transform:translate(32px,clamp(180px,38dvh,330px)) scale(1.824)}to{transform:translate(0,0) scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes gone{to{opacity:0;visibility:hidden}}
@keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-delay:0s!important}}
</style>
<style>html,body{margin:0;height:100%;height:100dvh;height:var(--app-h,100dvh);overflow:hidden;background:#0B1630}body{display:flex;justify-content:center}#stage{width:100%;max-width:430px;height:100%;overflow:hidden;background:#EDF2F8}#stage>div{width:100%!important;height:100%!important;box-sizing:border-box;overflow:hidden!important}</style></head><body><div id="stage"></div><template id="tpl">

<div style="position: relative; width: 100%; height: 100%; overflow: hidden; display: flex; flex-direction: column; background: linear-gradient(175deg, #0B1630 0%, #163A68 24%, #24508A 46%, #24508A 100%); color: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
<sc-if value="{{ on }}" hint-placeholder-val="{{ true }}">
  <div aria-hidden="true" style="position: absolute; width: 340px; height: 340px; right: -130px; top: -80px; border-radius: 999px; background: radial-gradient(circle, rgba(168,199,236,0.55), rgba(168,199,236,0) 68%); animation: drift 9s ease-in-out infinite"></div>
  <div aria-hidden="true" style="position: absolute; width: 300px; height: 300px; left: -140px; top: 200px; border-radius: 999px; background: radial-gradient(circle, rgba(230,169,58,0.32), rgba(230,169,58,0) 68%); animation: drift 11s ease-in-out infinite"></div>

  <button type="button" onClick="{{ replay }}" aria-label="God's DNA, putar ulang splash" style="position: absolute; z-index: 2; left: 28px; top: clamp(14px, 3dvh, 28px); width: 148px; height: 44px; padding: 12px 0; box-sizing: border-box; background: none; border: 0; cursor: pointer">
    <img src="../assets/logo.png" alt="" style="width: 148px; height: 20px; display: block; transform-origin: 0 0; animation: wipe .8s cubic-bezier(.7,0,.2,1) .2s both, dock .9s cubic-bezier(.76,0,.24,1) 2s both">
  </button>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 22px; animation: gone .3s ease-in 1.9s forwards">
    <div style="width: 56px; height: 3px; border-radius: 2px; background: #E6A93A; animation: line .5s ease-out .9s both"></div>
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: #D6E4F6; animation: rise .5s ease-out 1.1s both">Discipleship</div>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 24px; right: 24px; bottom: clamp(24px, 5dvh, 48px); text-align: center; font-size: 13px; color: #D6E4F6; animation: gone .3s ease-in 1.9s forwards"><div style="animation: rise .5s ease-out 1.3s both">Exalt His name, proclaim His cross</div></div>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: clamp(58px, 9dvh, 104px) 28px clamp(14px, 2.5dvh, 28px); box-sizing: border-box">
    <h1 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 68%; font-weight: 850; font-size: clamp(42px, 6.8dvh, 62px); line-height: 0.95; text-transform: uppercase; animation: rise .6s ease-out 2.6s both">Bertumbuh<br>bareng.</h1>
    <p style="margin: clamp(8px, 1.5dvh, 14px) 0 0; font-size: clamp(14px, 2dvh, 15px); line-height: 22px; color: #D6E4F6; animation: rise .6s ease-out 2.8s both">Belajar tiap hari, ngobrol bareng mentor.</p>
  </div>

  <div style="flex-shrink: 0; max-height: 75%; overflow-y: auto; color: #16233A; animation: sheetUp .7s cubic-bezier(.2,.8,.2,1) 3s both; box-sizing: border-box; padding: clamp(18px, 3dvh, 30px) 24px clamp(14px, 2.5dvh, 24px); border-radius: 28px 28px 0 0; background: #FFFFFF; display: flex; flex-direction: column; gap: clamp(10px, 1.8dvh, 16px)">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="email" style="font-size: 13px; font-weight: 700">Email</label>
      <input id="email" type="email" placeholder="nama@email.com" autocomplete="email" style="height: clamp(46px, 6dvh, 52px); box-sizing: border-box; padding: 0 16px; border: 1.5px solid #6F849D; border-radius: 14px; background: #FFFFFF; color: #0B1630; font: inherit; font-size: 15px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pass" style="font-size: 13px; font-weight: 700">Password</label>
      <div style="position: relative">
        <input id="pass" type="{{ passType }}" placeholder="Masukkan password" autocomplete="current-password" style="width: 100%; height: clamp(46px, 6dvh, 52px); box-sizing: border-box; padding: 0 84px 0 16px; border: 1.5px solid #6F849D; border-radius: 14px; background: #FFFFFF; color: #0B1630; font: inherit; font-size: 15px">
        <button type="button" onClick="{{ toggle }}" style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); height: 40px; min-width: 72px; border: 0; background: none; color: #24508A; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{ toggleLabel }}</button>
      </div>
    </div>
    <div style="display: flex; justify-content: flex-end; margin-top: -6px">
      <a href="#email" style="display: inline-flex; align-items: center; min-height: 36px; font-size: 13px; font-weight: 700; text-decoration: none">Lupa password?</a>
    </div>
    <a href="Beranda.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: clamp(48px, 6.5dvh, 56px); flex-shrink: 0; border: 0; border-radius: 14px; background: linear-gradient(180deg,#2F62A4,#24508A); box-shadow: 0 4px 0 #163A68; color: #FFFFFF; font-family: 'Archivo', sans-serif; font-stretch: 80%; font-weight: 800; font-size: 18px; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; cursor: pointer">Masuk</a>
    <div style="display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 14px; color: #4B5A72">
      <span>Belum punya akun?</span>
      <a href="Kode.html" style="display: inline-flex; align-items: center; min-height: 38px; font-weight: 700">Daftar</a>
    </div>
  </div>
</sc-if>
</div>
</template><script>class DCLogic{constructor(){this.props={}}setState(s){Object.assign(this.state,typeof s=="function"?s(this.state):s);window.__paint&&__paint()}forceUpdate(){window.__paint&&__paint()}}

class Component extends DCLogic {
  state = { on: true, show: false };
  replay = () => {
    this.setState({ on: false });
    setTimeout(() => this.setState({ on: true }), 40);
  };
  toggle = () => this.setState({ show: !this.state.show });
  renderVals() {
    return {
      on: this.state.on,
      replay: this.replay,
      toggle: this.toggle,
      passType: this.state.show ? 'text' : 'password',
      toggleLabel: this.state.show ? 'Sembunyi' : 'Lihat'
    };
  }
}
</script><script src="../assets/runtime.js"></script></body></html>
